<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Laptop Selection Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6.16"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000; /* Pure black */
            color: #e5e7eb;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* Custom Neon/Minimalist Sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            height: 24px; /* Space for the thumb */
        }
        
        input[type=range]:focus {
            outline: none;
        }

        /* Track */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            /* The track color is dynamically updated via JS variable --value */
            background: linear-gradient(to right, #ffffff var(--value, 50%), #333333 var(--value, 50%));
            border-radius: 2px;
        }

        /* Thumb */
        input[type=range]::-webkit-slider-thumb {
            height: 24px;
            width: 10px;
            border-radius: 6px;
            border: 2px solid #ffffff;
            background: #000000; /* Hollow center look */
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -10px; /* Center thumb on the track */
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        /* Firefox Support */
        input[type=range]::-moz-range-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #333333;
            border-radius: 2px;
        }
        input[type=range]::-moz-range-progress {
            background-color: #ffffff;
            height: 4px;
            border-radius: 2px;
        }
        input[type=range]::-moz-range-thumb {
            height: 24px;
            width: 10px;
            border-radius: 6px;
            border: 2px solid #ffffff;
            background: #000000;
            cursor: pointer;
        }
        
        /* Plot Overrides */
        svg {
            max-width: 100%;
            height: auto;
        }

        /* Table styles */
        .laptop-row {
            transition: all 0.2s ease;
        }
        .laptop-row:hover {
            background-color: #111111;
        }
        .laptop-row.selected {
            background-color: #1a1a1a;
            border-left: 3px solid #ffffff;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

    <div class="max-w-6xl mx-auto space-y-10">
        
        <!-- Header -->
        <div class="pb-6 border-b border-[#222]">
            <h1 class="text-3xl font-bold text-white tracking-tight">CAD Laptop Matrix</h1>
            <p class="text-gray-400 mt-2 text-sm">Интерактивный подбор конфигурации (Бюджет до 200 000 ₽)</p>
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
            
            <!-- Left Column: Chart & Top Pick -->
            <div class="lg:col-span-7 flex flex-col">
                
                <!-- Chart Container -->
                <div id="plot-container" class="w-full overflow-x-auto min-h-[300px] mb-8"></div>

                <!-- Top Pick Section (Matches Screenshot) -->
                <div class="py-8 border-y border-[#222] flex flex-col items-center justify-center text-center my-auto">
                    <p class="text-gray-400 text-sm mb-3">Top Pick</p>
                    <h2 id="winner-name" class="text-2xl text-white font-mono tracking-widest uppercase">Вычисляем...</h2>
                </div>

            </div>

            <!-- Right Column: Sliders -->
            <div class="lg:col-span-5 flex flex-col justify-center">
                
                <div class="space-y-8">
                    <!-- Power Slider -->
                    <div class="flex items-center gap-4">
                        <label class="w-1/3 text-sm font-medium text-gray-300">Rendering Power</label>
                        <div class="flex-grow flex items-center relative">
                            <input type="range" id="w-power" min="1" max="10" value="5" class="w-full">
                        </div>
                        <div class="w-14 h-14 bg-[#111111] border border-[#222] rounded-2xl flex items-center justify-center text-white text-xl font-medium shadow-inner">
                            <span id="val-power">5</span>
                        </div>
                    </div>

                    <!-- Battery Slider -->
                    <div class="flex items-center gap-4">
                        <label class="w-1/3 text-sm font-medium text-gray-300">Battery Life</label>
                        <div class="flex-grow flex items-center relative">
                            <input type="range" id="w-battery" min="1" max="10" value="5" class="w-full">
                        </div>
                        <div class="w-14 h-14 bg-[#111111] border border-[#222] rounded-2xl flex items-center justify-center text-white text-xl font-medium shadow-inner">
                            <span id="val-battery">5</span>
                        </div>
                    </div>

                    <!-- Screen Slider -->
                    <div class="flex items-center gap-4">
                        <label class="w-1/3 text-sm font-medium text-gray-300">Screen Quality</label>
                        <div class="flex-grow flex items-center relative">
                            <input type="range" id="w-screen" min="1" max="10" value="5" class="w-full">
                        </div>
                        <div class="w-14 h-14 bg-[#111111] border border-[#222] rounded-2xl flex items-center justify-center text-white text-xl font-medium shadow-inner">
                            <span id="val-screen">5</span>
                        </div>
                    </div>

                    <!-- Mobility Slider -->
                    <div class="flex items-center gap-4">
                        <label class="w-1/3 text-sm font-medium text-gray-300">Mobility/Weight</label>
                        <div class="flex-grow flex items-center relative">
                            <input type="range" id="w-mobility" min="1" max="10" value="5" class="w-full">
                        </div>
                        <div class="w-14 h-14 bg-[#111111] border border-[#222] rounded-2xl flex items-center justify-center text-white text-xl font-medium shadow-inner">
                            <span id="val-mobility">5</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Details Table Section (Styled to match the dark theme) -->
        <div class="mt-16 border border-[#222] bg-[#050505] rounded-3xl overflow-hidden">
            <h2 class="text-sm uppercase tracking-widest font-semibold p-6 pb-4 text-gray-400 border-b border-[#222]">Детальное сравнение (Кликни для обзора)</h2>
            
            <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-gray-300" id="laptop-table">
                <thead class="text-xs text-gray-500 uppercase bg-[#0a0a0a]">
                    <tr>
                        <th scope="col" class="px-6 py-4 font-medium">Модель</th>
                        <th scope="col" class="px-6 py-4 font-medium">Процессор</th>
                        <th scope="col" class="px-6 py-4 font-medium">ОЗУ</th>
                        <th scope="col" class="px-6 py-4 font-medium">GPU</th>
                        <th scope="col" class="px-6 py-4 font-medium">VRAM</th>
                        <th scope="col" class="px-6 py-4 font-medium">Вес</th>
                        <th scope="col" class="px-6 py-4 font-medium">Цена (~₽)</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-[#1a1a1a]">
                    <!-- Populated by JS -->
                </tbody>
            </table>
            </div>

            <!-- Details View -->
            <div id="details-view" class="hidden border-t border-[#222] bg-[#0a0a0a] p-8">
            <div class="flex justify-between items-start mb-6">
                <h3 id="detail-title" class="text-xl font-bold text-white font-mono">Model Name</h3>
                <span id="detail-tag" class="px-3 py-1 bg-[#1a1a1a] border border-[#333] rounded-md text-xs font-mono text-gray-300">Tag</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <h4 class="text-sm font-semibold text-white mb-4 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-green-400"></span> Плюсы
                    </h4>
                    <ul id="detail-pros" class="space-y-2 text-sm text-gray-400"></ul>
                </div>
                <div>
                    <h4 class="text-sm font-semibold text-white mb-4 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-red-400"></span> Минусы
                    </h4>
                    <ul id="detail-cons" class="space-y-2 text-sm text-gray-400"></ul>
                </div>
            </div>
            <div class="mt-8 pt-6 border-t border-[#222] flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <p class="text-sm text-gray-400"><span class="font-semibold text-white">Вердикт: </span><span id="detail-verdict"></span></p>
                    <a id="detail-link" href="#" target="_blank" class="shrink-0 inline-flex items-center justify-center gap-2 px-6 py-3 bg-white text-black text-sm font-bold rounded-xl transition-all hover:bg-gray-200">
                    Найти на Яндекс Маркете
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                </a>
            </div>
            </div>
        </div>
    </div>

    <script>
        // Data Definition with Custom Chart Colors
        const laptops = [
            {
                id: "gigabyte",
                name: "Gigabyte Aero X16",
                cpu: "Ryzen AI 7 350",
                ram: "32 ГБ DDR5",
                gpu: "RTX 5070 (85W)",
                vram: "8 ГБ GDDR7",
                weight: "1.9 кг",
                price: "197 156",
                link: "https://market.yandex.ru/search?text=Gigabyte%20Aero%20X16%20Ryzen%20AI%207%20350%20RTX%205070",
                attrs: { power: 8.5, battery: 8.5, screen: 9.5, mobility: 9.0 },
                color: "#c8a57e", // Bronze/Gold
                pros: ["Точная калибровка Pantone (100% sRGB) - идеал для Photoshop", "Тонкий алюминиевый корпус", "Отличная автономность (до 8 часов)"],
                cons: ["Урезанный TGP видеокарты (85 Вт)", "Второй слот SSD работает на урезанной скорости (Gen4x2)"],
                verdict: "Идеальный баланс. Тонкая и стильная машина для графики без розетки.",
                tag: "БЕЛЫЙ ВОРОТНИЧОК"
            },
            {
                id: "lenovo-slim",
                name: "Lenovo Legion Slim 5",
                cpu: "Ryzen 7 8845HS",
                ram: "32 ГБ DDR5",
                gpu: "RTX 4070 (140W)",
                vram: "8 ГБ GDDR6",
                weight: "2.3 кг",
                price: "168 900",
                link: "https://market.yandex.ru/search?text=Lenovo%20Legion%20Slim%205%20Gen%209%2016%22%20RTX%204070",
                attrs: { power: 9.5, battery: 7.0, screen: 8.0, mobility: 6.0 },
                color: "#a7f3d0", // Light Green
                pros: ["Полноценная видеокарта на 140 Вт", "Отличное охлаждение", "Надежный IPS экран"],
                cons: ["Тяжелее конкурентов (2.3 кг)", "Пластиково-металлический корпус"],
                verdict: "Король производительности. Отличный выбор для стационарной работы.",
                tag: "ЗОЛОТАЯ СЕРЕДИНА"
            },
            {
                id: "asus",
                name: "ASUS ProArt P16",
                cpu: "Ryzen AI 9 HX 370",
                ram: "32 ГБ LPDDR5X",
                gpu: "RTX 5060 (105W)",
                vram: "8 ГБ GDDR7",
                weight: "1.85 кг",
                price: "212 500",
                link: "https://market.yandex.ru/search?text=ASUS%20ProArt%20P16%20H7606WM-RJ103X",
                attrs: { power: 8.5, battery: 9.0, screen: 10.0, mobility: 9.5 },
                color: "#fca5a5", // Soft Red/Pink
                pros: ["Шикарный OLED экран с сенсором (100% DCI-P3)", "Лучшая автономность в классе", "Легкий корпус, огромный тачпад-контроллер"],
                cons: ["Высокая цена", "Теоретический риск выгорания OLED при сутках работы с CAD", "Глянцевый экран"],
                verdict: "Бескомпромиссная рабочая станция для креативщиков, если бюджет позволяет.",
                tag: "ПРЕМИУМ ТОП"
            },
            {
                id: "msi",
                name: "MSI Stealth 16 Studio",
                cpu: "Core Ultra 9",
                ram: "32 ГБ DDR5",
                gpu: "RTX 4070 (105W)",
                vram: "8 ГБ GDDR6",
                weight: "1.99 кг",
                price: "185 000",
                link: "https://market.yandex.ru/search?text=MSI%20Stealth%2016%20AI%20Studio%20RTX%204070",
                attrs: { power: 8.0, battery: 7.5, screen: 8.5, mobility: 8.5 },
                color: "#93c5fd", // Light Blue
                pros: ["Тонкий и легкий (менее 2 кг)", "Отличная сборка", "Много портов"],
                cons: ["Перевернутая материнская плата (сложно апгрейдить)"],
                verdict: "Хорошая альтернатива Gigabyte, но сложнее в обслуживании.",
                tag: "ТОНКИЙ КОНКУРЕНТ"
            }
        ];

        let weights = {
            power: 5,
            battery: 5,
            screen: 5,
            mobility: 5
        };

        let calculatedData = [];

        function updateSliderTrack(slider) {
            const val = slider.value;
            const min = slider.min ? slider.min : 1;
            const max = slider.max ? slider.max : 10;
            const percentage = ((val - min) / (max - min)) * 100;
            slider.style.setProperty('--value', `${percentage}%`);
        }

        function recalculate() {
            calculatedData = laptops.map(laptop => {
                const score = 
                    (laptop.attrs.power * weights.power) +
                    (laptop.attrs.battery * weights.battery) +
                    (laptop.attrs.screen * weights.screen) +
                    (laptop.attrs.mobility * weights.mobility);
                
                return {
                    ...laptop,
                    rawScore: Math.round(score) // Max possible is 400 (10*10*4)
                };
            }).sort((a, b) => b.rawScore - a.rawScore); // Sort descending

            updateUI();
        }

        function updateUI() {
            const winner = calculatedData[0];
            document.getElementById('winner-name').textContent = winner.name;

            renderPlot();
            
            document.querySelectorAll('.laptop-row').forEach(row => {
                row.classList.remove('selected');
            });
        }

        function renderPlot() {
            const container = document.getElementById("plot-container");
            container.innerHTML = ""; 

            const chart = Plot.plot({
                style: {
                    background: "transparent",
                    color: "#9ca3af", // gray-400
                    fontFamily: "'Inter', sans-serif",
                    fontSize: "13px"
                },
                width: container.clientWidth,
                height: 350,
                marginLeft: 180, 
                marginRight: 60,
                x: {
                    label: "Suitability Score →",
                    domain: [0, 400],
                    grid: true,
                    strokeOpacity: 0.1,
                    ticks: [0, 200, 400],
                    labelAnchor: "right",
                    labelOffset: 40
                },
                y: {
                    label: null,
                    domain: calculatedData.map(d => d.name), 
                    paddingInner: 0.4
                },
                marks: [
                    Plot.barX(calculatedData, {
                        x: "rawScore",
                        y: "name",
                        fill: "color", // Use explicit colors from data
                        rx: 6, // rounded corners
                        tip: true,
                    }),
                    Plot.text(calculatedData, {
                        x: "rawScore",
                        y: "name",
                        text: d => d.rawScore,
                        textAnchor: "start",
                        dx: 12, // offset to the right of the bar
                        fill: "#ffffff",
                        fontWeight: "bold",
                        fontFamily: "'JetBrains Mono', monospace",
                        fontSize: 14
                    })
                ]
            });

            container.appendChild(chart);
        }

        function setupListeners() {
            const keys = ['power', 'battery', 'screen', 'mobility'];
            
            keys.forEach(key => {
                const slider = document.getElementById(`w-${key}`);
                const display = document.getElementById(`val-${key}`);
                
                // Init track fill
                updateSliderTrack(slider);

                slider.addEventListener('input', (e) => {
                    const val = parseInt(e.target.value);
                    weights[key] = val;
                    display.textContent = val;
                    updateSliderTrack(e.target);
                    recalculate();
                });
            });

            window.addEventListener("resize", () => {
                requestAnimationFrame(renderPlot);
            });
        }

        function initTable() {
            const tbody = document.getElementById('table-body');
            
            laptops.forEach(laptop => {
                const tr = document.createElement('tr');
                tr.className = 'laptop-row cursor-pointer';
                tr.dataset.id = laptop.id;
                
                tr.innerHTML = `
                    <th scope="row" class="px-6 py-5 font-semibold text-white whitespace-nowrap">
                        <div class="flex items-center gap-3">
                            <div class="w-3 h-3 rounded-full" style="background-color: ${laptop.color};"></div>
                            ${laptop.name}
                        </div>
                    </th>
                    <td class="px-6 py-5">${laptop.cpu}</td>
                    <td class="px-6 py-5 text-gray-400 font-mono text-xs">${laptop.ram}</td>
                    <td class="px-6 py-5">${laptop.gpu}</td>
                    <td class="px-6 py-5 text-gray-400 font-mono text-xs">${laptop.vram}</td>
                    <td class="px-6 py-5">${laptop.weight}</td>
                    <td class="px-6 py-5 font-medium text-white font-mono">${laptop.price} ₽</td>
                `;
                
                tr.addEventListener('click', () => {
                    document.querySelectorAll('.laptop-row').forEach(r => r.classList.remove('selected'));
                    tr.classList.add('selected');
                    
                    showDetails(laptop);
                });

                tbody.appendChild(tr);
            });
        }

        function showDetails(laptop) {
            const view = document.getElementById('details-view');
            view.classList.remove('hidden');
            
            document.getElementById('detail-title').textContent = laptop.name;
            document.getElementById('detail-tag').textContent = laptop.tag;
            document.getElementById('detail-verdict').textContent = laptop.verdict;
            document.getElementById('detail-link').href = laptop.link;
            
            const prosList = document.getElementById('detail-pros');
            prosList.innerHTML = laptop.pros.map(p => `<li>— ${p}</li>`).join('');
            
            const consList = document.getElementById('detail-cons');
            consList.innerHTML = laptop.cons.map(c => `<li>— ${c}</li>`).join('');
        }

        // Initialize App
        initTable();
        setupListeners();
        recalculate();

    </script>
</body>
</html>
